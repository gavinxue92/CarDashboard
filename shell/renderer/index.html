<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'">
<title>海外汽车服务工作台 · S0</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <!-- ===== 左栏：账号栏（我们的 DOM；一号 = 一块独立网页版） ===== -->
  <aside class="rail">
    <div class="brand">工作台</div>
    <div id="acctList" class="acct-list"></div>
    <div class="rail-foot">
      <div class="stage">S0 · 壳与登录</div>
      <div class="hint">加号 / 状态检测：<br>S2 外圈补齐</div>
    </div>
  </aside>

  <!-- ===== 中栏：官方网页版 <webview>（本尊，非复刻） ===== -->
  <section class="host">
    <div class="host-bar">
      <span class="host-tag">官方网页版 · web.whatsapp.com</span>
      <span class="host-part" id="hostPart">partition: —</span>
      <span class="host-state" id="hostState">初始化…</span>
    </div>
    <div class="host-body" id="hostBody">
      <!-- webview 由 renderer.js 按当前账号动态创建（切 partition 必须重建元素） -->
    </div>
  </section>

  <!-- ===== 右侧：功能工具栏 + 常驻客户面板（并存，2026-10-13 用户拍板「两个都要」） ===== -->
  <aside class="tools">
    <div class="tool on" id="toolCust" title="展开 / 收起客户面板"><span class="ico">👤</span><span class="tx">客户信息</span></div>
    <div class="tool dim" data-reserved="翻译设置（S3：入站译文副行 / 术语可点）"><span class="ico">🌐</span><span class="tx">翻译设置</span></div>
    <div class="tool dim" data-reserved="快捷消息（S2：代写网页版输入框成草稿，插入 ≠ 发送）"><span class="ico">💬</span><span class="tx">快捷消息</span></div>
    <div class="tool dim" data-reserved="出站确认层（S4：拦发送 → 先看译文再发）"><span class="ico">🛡</span><span class="tx">发送保护</span></div>
  </aside>

  <aside class="side" id="side">
    <div class="side-head">
      <span class="side-tab on" data-tab="profile">客户档案</span>
      <span class="side-tab" data-tab="cost">成本精算</span>
    </div>
    <div class="side-body">
      <!-- 客户档案（S0 占位：S1 观测同步落库后，此面板吃我们自己的 Repository） -->
      <div class="pane" data-pane="profile">
        <div class="field"><span class="k">客户 / 公司</span><span class="v muted">待 S1 数据</span></div>
        <div class="field"><span class="k">手机号</span><span class="v muted">取自当前会话</span></div>
        <div class="field"><span class="k">国家 / 城市</span><span class="v muted">—</span></div>
        <div class="field"><span class="k">意向阶段</span><span class="v muted">—</span></div>
        <div class="field"><span class="k">待跟进</span><span class="v muted">按对方最后发言计算</span></div>
        <div class="note">S0 阶段：面板骨架先行，数据源在 S1「观测同步」接通（消息落库后这些字段才有值）。</div>
      </div>
      <!-- 成本精算（预留入口：领域字段见 MEMORY「留扩展入口」节） -->
      <div class="pane hidden" data-pane="cost">
        <div class="field"><span class="k">车型</span><span class="v muted">预留</span></div>
        <div class="field"><span class="k">成本项</span><span class="v muted">cost_item 预留</span></div>
        <div class="field"><span class="k">目的国规则</span><span class="v muted">配置表预留</span></div>
        <div class="note">成本精算未开工。这里只留数据入口的形状（vehicle / quote / cost_item）。</div>
      </div>
    </div>
    <div class="side-foot" id="sideFoot">当前账号：—</div>
  </aside>
</div>

<script src="renderer.js"></script>
</body>
</html>
